[project]
name = "medibot-backend"
version = "1.0.0"
description = "MediBot — Advanced RAG with role-based access control enforced at the vector store layer"
readme = "../README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # --- API ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "python-dotenv>=1.0",

    # --- Retrieval ---
    "qdrant-client>=1.12",
    "fastembed>=0.4",

    # --- Ingestion ---
    "docling>=2.0",
    "docling-core[chunking]>=2.0",
    "transformers>=4.44",

    # --- Reranking ---
    # >=5 is required: the CrossEncoder kwarg was renamed
    # `default_activation_function` -> `activation_fn` and
    # `max_length` -> `max_seq_length` in v5.
    "sentence-transformers>=5",
    "torch>=2.4",

    # --- Generation ---
    "groq>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

# `app` and `ingest` are plain top-level packages run from this directory
# (`uv run python -m ingest.ingest`), not an installable distribution.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
