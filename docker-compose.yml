services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: medibot-qdrant
    ports:
      - "6333:6333"   # REST + dashboard -> http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      # The qdrant image is distroless - no curl, no wget. Its own binary
      # can answer the readiness probe, which is the only check that works here.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
